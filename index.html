    <!-- Dynamic Favicon Switcher based on prefers-color-scheme -->
    <script id="favicon-theme-switcher">
      (function() {
        const darkModeQuery = window.matchMedia('(prefers-color-scheme: dark)');

        function updateFavicons(isDark) {
          try {
            const svgLink = document.getElementById('favicon-svg');
            const png16Link = document.getElementById('favicon-16');
            const png32Link = document.getElementById('favicon-32');

            if (isDark) {
              if (svgLink) svgLink.href = '/favicon-dark.svg';
              if (png16Link) png16Link.href = '/favicon-dark-16x16.png';
              if (png32Link) png32Link.href = '/favicon-dark-32x32.png';
            } else {
              if (svgLink) svgLink.href = '/favicon-light.svg';
              if (png16Link) png16Link.href = '/favicon-light-16x16.png';
              if (png32Link) png32Link.href = '/favicon-light-32x32.png';
            }
          } catch (e) {
            // Gracefully keep fallback defaults
          }
        }

        // Apply immediately for optimal initial tab render
        updateFavicons(darkModeQuery.matches);

        // Listen for live system theme changes (e.g. automatic sunset or manual toggle)
        if (typeof darkModeQuery.addEventListener === 'function') {
          darkModeQuery.addEventListener('change', function(e) {
            updateFavicons(e.matches);
          });
        } else if (typeof darkModeQuery.addListener === 'function') {
          darkModeQuery.addListener(function(e) {
            updateFavicons(e.matches);
          });
        }
      })();
    </script>
